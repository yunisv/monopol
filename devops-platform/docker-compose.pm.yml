# Project / issue management: OpenProject community edition.
# Real self-hosted Jira Server is no longer sold by Atlassian for new
# customers (only Jira Data Center, which is licensed per-server and
# expensive) — OpenProject is the closest open-source equivalent with
# boards, backlogs, roadmaps and a REST API for the n8n/AI-agent glue.

networks:
  edge:
    external: true
    name: devops_edge

volumes:
  openproject-data:
  openproject-pgdata:

services:
  openproject:
    image: openproject/openproject:14
    restart: unless-stopped
    environment:
      OPENPROJECT_HOST__NAME: pm.${BASE_DOMAIN}
      OPENPROJECT_HTTPS: "true"
      OPENPROJECT_HSTS: "false" # Traefik already terminates TLS
      SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE}
      # Bundles its own Postgres/memcached; see docs/architecture.md
      # to point it at an external DB once the team outgrows this.
    volumes:
      - openproject-data:/var/openproject/assets
      - openproject-pgdata:/var/openproject/pgdata
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.openproject.rule=Host(`pm.${BASE_DOMAIN}`)
      - traefik.http.routers.openproject.entrypoints=websecure
      - traefik.http.routers.openproject.tls.certresolver=le
      - traefik.http.services.openproject.loadbalancer.server.port=80
