# Code quality + SAST: SonarQube. Wire into Gitea Actions with the
# sonar-scanner CLI as a pipeline step (see docs/architecture.md).

networks:
  edge:
    external: true
    name: devops_edge

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-db-data:

services:
  sonar-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - edge

  sonarqube:
    image: sonarqube:10-community
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarqube.rule=Host(`sonar.${BASE_DOMAIN}`)
      - traefik.http.routers.sonarqube.entrypoints=websecure
      - traefik.http.routers.sonarqube.tls.certresolver=le
      - traefik.http.services.sonarqube.loadbalancer.server.port=9000
